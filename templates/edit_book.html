<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">Edit Book</h4>
                    </div>
                    <div class="card-body">
                        <form action="/edit_book/{{ book.book_id }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Book Title</label>
                                <input type="text" name="title" class="form-control" value="{{ book.book_id_title if book.book_id_title else book.title }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Price ($)</label>
                                <input type="number" step="0.01" name="price" class="form-control" value="{{ book.price }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Author</label>
                                <select name="author_id" class="form-select" required>
                                    {% for author in authors %}
                                    <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>
                                        {{ author.name }} ({{ author.country }})
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-warning">Update Book</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
