<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2 class="mb-4 text-success">Edit Book</h2>
        <form method="POST" class="card p-4 shadow-sm border-0 bg-white">
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" name="title" class="form-control" value="{{ book.title }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price ($)</label>
                <input type="number" step="0.01" name="price" class="form-control" value="{{ book.price }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Publish Year</label>
                <input type="number" name="publish_year" class="form-control" value="{{ book.publish_year }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Author</label>
                <select name="author_id" class="form-select" required>
                    {% for author in authors %}
                    <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>{{ author.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Publisher</label>
                <select name="publisher_id" class="form-select" required>
                    {% for pub in publishers %}
                    <option value="{{ pub.publisher_id }}" {% if pub.publisher_id == book.publisher_id %}selected{% endif %}>{{ pub.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category_id" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat.category_id }}" {% if cat.category_id == book.category_id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <button type="submit" class="btn btn-success">Update Book</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
