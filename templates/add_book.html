<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4 text-success">Add New Book</h2>
        <form method="POST" class="card p-4 shadow-sm border-0">
            <div class="mb-3">
                <label class="form-label">Book Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Price ($)</label>
                <input type="number" step="0.01" name="price" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Publish Year</label>
                <input type="number" name="publish_year" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Author</label>
                <select name="author_id" class="form-select" required>
                    {% for author in authors %}
                    <option value="{{ author.author_id }}">{{ author.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Publisher</label>
                <select name="publisher_id" class="form-select" required>
                    {% for pub in publishers %}
                    <option value="{{ pub.publisher_id }}">{{ pub.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category_id" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat.category_id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success">Save Book</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary mt-2">Cancel</a>
        </form>
    </div>
</body>
</html>
