<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Add New Book</h4>
                    </div>
                    <div class="card-body">
                        <form action="/add_book" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Book Title</label>
                                <input type="text" name="title" class="form-control" required placeholder="e.g. 1984">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Price ($)</label>
                                <input type="number" step="0.01" name="price" class="form-control" required placeholder="19.99">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Author</label>
                                <select name="author_id" class="form-select" required>
                                    <option value="" disabled selected>Select an Author</option>
                                    {% for author in authors %}
                                    <option value="{{ author.author_id }}">{{ author.name }} ({{ author.country }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="/" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-success">Save Book</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
